<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Préstamo de Equipos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { color: #1A365D; margin-top: 0; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { display: block; margin-top: 8px; }
        .opciones { display: flex; gap: 15px; margin: 8px 0; }
        .opciones label { display: flex; align-items: center; gap: 5px; margin: 0; }
        input[type="radio"] { width: auto; margin: 0; }
        button { width: 100%; padding: 10px; background: #1B4D3E; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #143b2f; }
        .error { color: #8B0000; font-size: 14px; margin-bottom: 10px; }
        .exito { color: #1B4D3E; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Préstamo de Equipos</h2>

        {% if aprobado %}
            <p class="exito"><b>Préstamo aprobado para {{ nombre }} ({{ equipo }}). Folio: {{ folio }}</b></p>
        {% elif motivo %}
            <p class="error"><b>{{ motivo }}</b></p>
        {% endif %}

        <form action="/prestar-equipo" method="POST">
            <label for="nombre">Nombre del estudiante:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="equipo">Equipo:</label>
            <select id="equipo" name="equipo" required>
                <option value="Router Cisco">Router Cisco</option>
                <option value="Laptop de Pruebas">Laptop de Pruebas</option>
                <option value="Multímetro Digital">Multímetro Digital</option>
            </select>

            <label>Adeudos previos:</label>
            <div class="opciones">
                <label><input type="radio" name="adeudos" value="Si" required> Sí</label>
                <label><input type="radio" name="adeudos" value="No"> No</label>
            </div>

            <label for="semestre">Semestre:</label>
            <input type="number" id="semestre" name="semestre" min="1" required>

            <button type="submit">Solicitar</button>
        </form>
    </div>
</body>
</html>
